# ==============================================================================
# Google MCP Toolbox for Databases - Configuration
# TBX FinOps Assistant (Tiby) - Banking & Transaction Tools
# ==============================================================================

sources:
  finops_db:
    kind: postgres
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

tools:
  get_account_balance:
    kind: postgres-sql
    source: finops_db
    description: "Get the current available balance, bank name, program ID, and masked account number for an account using account_id or account_number"
    parameters:
      - name: identifier
        type: string
        description: "The account masked number or last 4 digits (e.g. '9069' or 'XXXXXX9069') or account UUID"
    statement: |
      SELECT 
        a.account_id,
        a.entity_id,
        CONCAT('XXXXXX', RIGHT(a.account_number, 4)) AS account_number_masked,
        a.program_id,
        a.available_balance,
        a.bank_code,
        b.bank_name
      FROM account a
      JOIN bank b ON a.bank_code = b.bank_code
      WHERE a.account_id = $1 
         OR a.account_id LIKE $1 || '%'
         OR a.account_number = $1 
         OR a.account_number LIKE '%' || $1
      ORDER BY CASE WHEN a.account_id = $1 OR a.account_number = $1 THEN 0 ELSE 1 END
      LIMIT 1;

  get_accounts_by_entity:
    kind: postgres-sql
    source: finops_db
    description: "List all bank accounts, banks, and available balances belonging to a specific customer or entity"
    parameters:
      - name: entity_id
        type: string
        description: "The entity UUID/ID (e.g. 'f2f5e332-c2d1-4555-9a6b-65c7cd195077')"
    statement: |
      SELECT 
        a.account_id,
        a.entity_id,
        CONCAT('XXXXXX', RIGHT(a.account_number, 4)) AS account_number_masked,
        a.program_id,
        a.available_balance,
        a.bank_code,
        b.bank_name
      FROM account a
      JOIN bank b ON a.bank_code = b.bank_code
      WHERE a.entity_id = $1
      ORDER BY a.available_balance DESC;

  get_bank_summary:
    kind: postgres-sql
    source: finops_db
    description: "Get total account count and aggregated available balance held at a specific bank"
    parameters:
      - name: bank_identifier
        type: string
        description: "Bank code (e.g. 'HDFC', 'ICIC', 'SBIN', 'UTIB', 'UBIN') or bank name (e.g. 'HDFC BANK LIMITED')"
    statement: |
      SELECT 
        b.bank_code,
        b.bank_name,
        COUNT(a.account_id) AS total_accounts,
        COALESCE(SUM(a.available_balance), 0) AS total_available_balance
      FROM bank b
      LEFT JOIN account a ON b.bank_code = a.bank_code
      WHERE b.bank_code ILIKE '%' || $1 || '%' OR b.bank_name ILIKE '%' || $1 || '%'
      GROUP BY b.bank_code, b.bank_name;

  get_transaction_by_reference:
    kind: postgres-sql
    source: finops_db
    description: "Lookup transaction details by transaction_reference_id (receipt/ref no), UTR number, or transaction UUID"
    parameters:
      - name: reference_id
        type: string
        description: "The transaction reference ID (e.g. '1715499972', 'S31125841', 'HDFCH01078329532') or UTR number or transaction_id"
    statement: |
      SELECT 
        t.transaction_id,
        t.account_id,
        CONCAT('XXXXXX', RIGHT(a.account_number, 4)) AS account_number_masked,
        a.bank_code,
        b.bank_name,
        TO_CHAR(t.transaction_date, 'YYYY-MM-DD HH24:MI:SS') AS transaction_date,
        t.transaction_type,
        t.transaction_amount,
        t.description,
        t.transaction_reference_id,
        CASE WHEN t.utr_number IS NOT NULL THEN CONCAT('ENC:', LEFT(t.utr_number, 8), '...[PROTECTED]') ELSE NULL END AS utr_number_masked
      FROM transaction t
      JOIN account a ON t.account_id = a.account_id
      JOIN bank b ON a.bank_code = b.bank_code
      WHERE t.transaction_reference_id = $1 
         OR t.transaction_reference_id LIKE $1 || '%'
         OR t.utr_number = $1
         OR t.utr_number LIKE '%' || $1
         OR t.transaction_id = $1
         OR t.transaction_id LIKE $1 || '%'
      ORDER BY CASE WHEN t.transaction_reference_id = $1 OR t.utr_number = $1 OR t.transaction_id = $1 THEN 0 ELSE 1 END
      LIMIT 1;

  get_account_transactions:
    kind: postgres-sql
    source: finops_db
    description: "Get recent transaction history (credit and debit records) for a specific account"
    parameters:
      - name: identifier
        type: string
        description: "The account masked number or last 4 digits (e.g. '9069' or 'XXXXXX9069') or account UUID"
    statement: |
      SELECT 
        t.transaction_id,
        CONCAT('XXXXXX', RIGHT(a.account_number, 4)) AS account_number_masked,
        a.bank_code,
        b.bank_name,
        TO_CHAR(t.transaction_date, 'YYYY-MM-DD HH24:MI:SS') AS transaction_date,
        t.transaction_type,
        t.transaction_amount,
        t.description,
        t.transaction_reference_id
      FROM transaction t
      JOIN account a ON t.account_id = a.account_id
      JOIN bank b ON a.bank_code = b.bank_code
      WHERE a.account_id = $1 
         OR a.account_id LIKE $1 || '%'
         OR a.account_number = $1 
         OR a.account_number LIKE '%' || $1
      ORDER BY t.transaction_date DESC
      LIMIT 20;

  get_transaction_volume_summary:
    kind: postgres-sql
    source: finops_db
    description: "Get ALL-TIME transaction summary across all accounts and all dates: total transaction count, credits count/amount, debits count/amount, and net flow. WARNING: this is NOT filtered by any date/month, so it must NOT be used for questions about a specific month or period. For a specific month use get_monthly_transaction_summary."
    statement: |
      SELECT 
        COUNT(t.transaction_id) AS total_transactions,
        COALESCE(SUM(CASE WHEN t.transaction_type = 'credit' THEN 1 ELSE 0 END), 0) AS total_credits_count,
        COALESCE(SUM(CASE WHEN t.transaction_type = 'credit' THEN t.transaction_amount ELSE 0 END), 0) AS total_credits_amount,
        COALESCE(SUM(CASE WHEN t.transaction_type = 'debit' THEN 1 ELSE 0 END), 0) AS total_debits_count,
        COALESCE(SUM(CASE WHEN t.transaction_type = 'debit' THEN t.transaction_amount ELSE 0 END), 0) AS total_debits_amount,
        (COALESCE(SUM(CASE WHEN t.transaction_type = 'credit' THEN t.transaction_amount ELSE 0 END), 0) -
         COALESCE(SUM(CASE WHEN t.transaction_type = 'debit' THEN t.transaction_amount ELSE 0 END), 0)) AS net_flow
      FROM transaction t;

  get_monthly_transaction_summary:
    kind: postgres-sql
    source: finops_db
    description: "Get the total debit and credit transactions (count and amount) and detail transaction records for a specific calendar month across ALL accounts. You MUST call this tool for ANY month-scoped question, including 'All transactions in June 2026', 'transactions in June', 'list transactions in May', 'debits and credits in May', or 'how many transactions in June'. Pass the month in YYYY-MM format (e.g. '2026-06' for June 2026)."
    parameters:
      - name: month
        type: string
        description: "The calendar month in YYYY-MM format, e.g. '2026-06' for June 2026"
    statement: |
      WITH month_txns AS (
        SELECT
          t.transaction_id,
          CONCAT('XXXXXX', RIGHT(a.account_number, 4)) AS account_number_masked,
          a.bank_code,
          b.bank_name,
          TO_CHAR(t.transaction_date, 'YYYY-MM-DD HH24:MI:SS') AS transaction_date,
          t.transaction_type,
          t.transaction_amount,
          t.description,
          t.transaction_reference_id,
          ROW_NUMBER() OVER (ORDER BY t.transaction_date DESC) AS rn
        FROM transaction t
        JOIN account a ON t.account_id = a.account_id
        JOIN bank b ON a.bank_code = b.bank_code
        WHERE TO_CHAR(t.transaction_date, 'YYYY-MM') = $1
      )
      SELECT
        COUNT(t.transaction_id) AS total_transactions,
        COALESCE(SUM(CASE WHEN t.transaction_type = 'credit' THEN 1 ELSE 0 END), 0) AS total_credits_count,
        COALESCE(SUM(CASE WHEN t.transaction_type = 'credit' THEN t.transaction_amount ELSE 0 END), 0) AS total_credits_amount,
        COALESCE(SUM(CASE WHEN t.transaction_type = 'debit' THEN 1 ELSE 0 END), 0) AS total_debits_count,
        COALESCE(SUM(CASE WHEN t.transaction_type = 'debit' THEN t.transaction_amount ELSE 0 END), 0) AS total_debits_amount,
        (COALESCE(SUM(CASE WHEN t.transaction_type = 'credit' THEN t.transaction_amount ELSE 0 END), 0) -
         COALESCE(SUM(CASE WHEN t.transaction_type = 'debit' THEN t.transaction_amount ELSE 0 END), 0)) AS net_flow,
        (SELECT COALESCE(json_agg(json_build_object(
          'transaction_id', d.transaction_id,
          'account_number_masked', d.account_number_masked,
          'bank_code', d.bank_code,
          'bank_name', d.bank_name,
          'transaction_date', d.transaction_date,
          'transaction_type', d.transaction_type,
          'transaction_amount', d.transaction_amount,
          'description', d.description,
          'transaction_reference_id', d.transaction_reference_id
        )), '[]'::json)
        FROM (SELECT * FROM month_txns WHERE rn <= 50) d) AS detail_rows
      FROM transaction t
      WHERE TO_CHAR(t.transaction_date, 'YYYY-MM') = $1;

  list_banks:
    kind: postgres-sql
    source: finops_db
    description: "List all registered banks in the system and their associated account count"
    statement: |
      SELECT 
        b.bank_code,
        b.bank_name,
        COUNT(a.account_id) AS registered_accounts
      FROM bank b
      LEFT JOIN account a ON b.bank_code = a.bank_code
      GROUP BY b.bank_code, b.bank_name
      ORDER BY b.bank_code ASC;

  calculate_vendor_spend:
    kind: postgres-sql
    source: finops_db
    description: "Calculate total spend (debit transactions) for a vendor by fuzzy name match within a date range. Returns total_spend, transaction_count, avg_ticket_size, and up to 50 detail rows."
    parameters:
      - name: vendor_name
        type: string
        description: "Vendor name or partial name to search (e.g. 'SELECTION', 'RELIANCE')"
      - name: start_date
        type: string
        description: "Start date in YYYY-MM-DD format (e.g. '2025-01-01')"
      - name: end_date
        type: string
        description: "End date in YYYY-MM-DD format (e.g. '2026-12-31')"
    statement: |
      WITH matched_txns AS (
        SELECT
          t.transaction_id,
          t.account_id,
          CONCAT('XXXXXX', RIGHT(a.account_number, 4)) AS account_number_masked,
          a.bank_code,
          b.bank_name,
          TO_CHAR(t.transaction_date, 'YYYY-MM-DD HH24:MI:SS') AS transaction_date,
          t.transaction_type,
          t.transaction_amount,
          t.description,
          t.transaction_reference_id,
          COALESCE(SUM(t.transaction_amount) OVER (), 0) AS total_spend,
          COUNT(t.transaction_id) OVER () AS transaction_count,
          ROUND(COALESCE(AVG(t.transaction_amount) OVER (), 0), 2) AS avg_ticket_size,
          ROW_NUMBER() OVER (ORDER BY t.transaction_date DESC) AS rn
        FROM transaction t
        JOIN account a ON t.account_id = a.account_id
        JOIN bank b ON a.bank_code = b.bank_code
        WHERE t.transaction_type = 'debit'
          AND t.description ILIKE '%' || $1 || '%'
          AND t.transaction_date >= $2::timestamp
          AND t.transaction_date < ($3::timestamp + INTERVAL '1 day')
      )
      SELECT
        m.total_spend,
        m.transaction_count,
        m.avg_ticket_size,
        (SELECT COALESCE(json_agg(json_build_object(
          'transaction_id', d.transaction_id,
          'account_number_masked', d.account_number_masked,
          'bank_code', d.bank_code,
          'bank_name', d.bank_name,
          'transaction_date', d.transaction_date,
          'transaction_amount', d.transaction_amount,
          'description', d.description,
          'transaction_reference_id', d.transaction_reference_id
        )) FILTER (WHERE d.rn <= 50 AND d.transaction_id IS NOT NULL), '[]'::json)
        FROM matched_txns d) AS detail_rows
      FROM matched_txns m
      WHERE m.rn = 1;

  get_unreconciled_accounts:
    kind: postgres-sql
    source: finops_db
    description: "Find accounts where available_balance does not match the calculated ledger balance (sum of credits minus debits). Optionally filter by bank_code."
    parameters:
      - name: bank_code
        type: string
        description: "Optional bank code filter (e.g. 'HDFC', 'ICIC'). Pass empty string '' for all banks."
    statement: |
      SELECT
        a.account_id,
        CONCAT('XXXXXX', RIGHT(a.account_number, 4)) AS account_number_masked,
        a.bank_code,
        b.bank_name,
        a.available_balance,
        COALESCE(SUM(CASE WHEN t.transaction_type = 'credit' THEN t.transaction_amount ELSE -t.transaction_amount END), 0) AS calculated_ledger_balance,
        a.available_balance - COALESCE(SUM(CASE WHEN t.transaction_type = 'credit' THEN t.transaction_amount ELSE -t.transaction_amount END), 0) AS discrepancy
      FROM account a
      JOIN bank b ON a.bank_code = b.bank_code
      LEFT JOIN transaction t ON t.account_id = a.account_id
      WHERE ($1::text IS NULL OR $1::text = '' OR a.bank_code ILIKE $1::text)
      GROUP BY a.account_id, a.account_number, a.bank_code, b.bank_name, a.available_balance
      HAVING ABS(a.available_balance - COALESCE(SUM(CASE WHEN t.transaction_type = 'credit' THEN t.transaction_amount ELSE -t.transaction_amount END), 0)) > 0.01
      ORDER BY ABS(a.available_balance - COALESCE(SUM(CASE WHEN t.transaction_type = 'credit' THEN t.transaction_amount ELSE -t.transaction_amount END), 0)) DESC;

  compare_periods:
    kind: postgres-sql
    source: finops_db
    description: "Compare vendor debit spend between two date periods. Returns period1_total, period2_total, absolute_delta, and percentage_change."
    parameters:
      - name: vendor_name
        type: string
        description: "Vendor name or partial name to search"
      - name: p1_start
        type: string
        description: "Period 1 start date (YYYY-MM-DD)"
      - name: p1_end
        type: string
        description: "Period 1 end date (YYYY-MM-DD)"
      - name: p2_start
        type: string
        description: "Period 2 start date (YYYY-MM-DD)"
      - name: p2_end
        type: string
        description: "Period 2 end date (YYYY-MM-DD)"
    statement: |
      SELECT
        period1_total,
        period2_total,
        (period2_total - period1_total) AS absolute_delta,
        CASE WHEN period1_total > 0 THEN ROUND(((period2_total - period1_total) / period1_total) * 100, 2) ELSE NULL END AS percentage_change
      FROM (
        SELECT
          COALESCE(SUM(CASE WHEN t.transaction_date >= $2::timestamp
                            AND t.transaction_date < ($3::timestamp + INTERVAL '1 day')
                       THEN t.transaction_amount END), 0) AS period1_total,
          COALESCE(SUM(CASE WHEN t.transaction_date >= $4::timestamp
                            AND t.transaction_date < ($5::timestamp + INTERVAL '1 day')
                       THEN t.transaction_amount END), 0) AS period2_total
        FROM transaction t
        WHERE t.transaction_type = 'debit'
          AND t.description ILIKE '%' || $1 || '%'
          AND ( (t.transaction_date >= $2::timestamp AND t.transaction_date < ($3::timestamp + INTERVAL '1 day'))
             OR (t.transaction_date >= $4::timestamp AND t.transaction_date < ($5::timestamp + INTERVAL '1 day')) )
      ) totals;

  detect_anomalies:
    kind: postgres-sql
    source: finops_db
    description: "Detect anomalous debit transactions for a vendor that exceed 2.5 standard deviations above the historical mean. Uses all transactions before start_date as baseline."
    parameters:
      - name: vendor_name
        type: string
        description: "Vendor name or partial name to search"
      - name: start_date
        type: string
        description: "Start of analysis window (YYYY-MM-DD)"
      - name: end_date
        type: string
        description: "End of analysis window (YYYY-MM-DD)"
    statement: |
      WITH baseline AS (
        SELECT
          AVG(t.transaction_amount) AS hist_avg,
          COALESCE(STDDEV(t.transaction_amount), 0) AS hist_stddev
        FROM transaction t
        WHERE t.transaction_type = 'debit'
          AND t.description ILIKE '%' || $1 || '%'
          AND t.transaction_date < $2::timestamp
      ),
      window_txns AS (
        SELECT
          t.transaction_id,
          t.account_id,
          CONCAT('XXXXXX', RIGHT(a.account_number, 4)) AS account_number_masked,
          a.bank_code,
          b.bank_name,
          TO_CHAR(t.transaction_date, 'YYYY-MM-DD HH24:MI:SS') AS transaction_date,
          t.transaction_amount,
          t.description,
          t.transaction_reference_id
        FROM transaction t
        JOIN account a ON t.account_id = a.account_id
        JOIN bank b ON a.bank_code = b.bank_code
        WHERE t.transaction_type = 'debit'
          AND t.description ILIKE '%' || $1 || '%'
          AND t.transaction_date >= $2::timestamp
          AND t.transaction_date < ($3::timestamp + INTERVAL '1 day')
      )
      SELECT
        w.*,
        b.hist_avg,
        b.hist_stddev,
        ROUND((CASE WHEN b.hist_stddev > 0 THEN b.hist_avg + 2.5 * b.hist_stddev ELSE 2.0 * b.hist_avg END), 2) AS anomaly_threshold,
        CASE WHEN b.hist_avg > 0 THEN ROUND(((w.transaction_amount / b.hist_avg) - 1) * 100, 2) ELSE NULL END AS pct_above_avg,
        CASE 
          WHEN b.hist_stddev > 0 AND w.transaction_amount > (b.hist_avg + 2.5 * b.hist_stddev) THEN true
          WHEN b.hist_stddev = 0 AND b.hist_avg > 0 AND w.transaction_amount > 2.0 * b.hist_avg THEN true
          ELSE false 
        END AS is_anomaly
      FROM window_txns w
      CROSS JOIN baseline b
      WHERE (b.hist_stddev > 0 AND w.transaction_amount > (b.hist_avg + 2.5 * b.hist_stddev))
         OR (b.hist_stddev = 0 AND b.hist_avg > 0 AND w.transaction_amount > 2.0 * b.hist_avg)
      ORDER BY w.transaction_amount DESC;
